name: orderstream-lab

services:
  kafka:
    image: docker.io/apache/kafka:4.3.1
    container_name: orderstream-kafka
    hostname: kafka
    ports:
      - "127.0.0.1:9092:9092"
    expose:
      - "9997"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "EXTERNAL://:9092,INTERNAL://:19092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "EXTERNAL://localhost:9092,INTERNAL://kafka:19092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "1"
      KAFKA_JMX_PORT: "9997"
      KAFKA_JMX_HOSTNAME: "kafka"
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    networks:
      - orderstream
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  kafka-init:
    image: docker.io/apache/kafka:4.3.1
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |-
        ensure_topic() {
          topic="$$1"
          partitions="$$2"
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic "$$topic" --partitions "$$partitions" --replication-factor 1
          current=$$(/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --describe --topic "$$topic" | sed -n 's/.*PartitionCount: \([0-9]*\).*/\1/p' | head -1)
          if [ -n "$$current" ] && [ "$$current" -lt "$$partitions" ]; then
            /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --alter --topic "$$topic" --partitions "$$partitions"
          fi
        }
        ensure_topic order_events 5
        ensure_topic notification_events 3
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - orderstream
    restart: "no"

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: orderstream-kafka-ui
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: "OrderStream local"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:19092"
      KAFKA_CLUSTERS_0_METRICS_TYPE: "JMX"
      KAFKA_CLUSTERS_0_METRICS_PORT: "9997"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - orderstream

volumes:
  kafka-data:

networks:
  orderstream:
    name: orderstream-net
